[project]
name = "surgical-implementation"
version = "1.1.0"
description = "Verified plan-then-implement software engineering workflow skill."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C901"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "pytest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
